name: Fix scanner database persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix scanner database persistence - apply'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch scanner database writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/scanner.ts')
          text = path.read_text()

          pattern = r'  const dbWrites = async \(\) => \{[\s\S]*?\n  \};\n\n  try \{'

          replacement = r'''  const dbWrites = async () => {
    const SNAPSHOT_BATCH_SIZE = 25;
    const persistenceErrors: string[] = [];
    let persistedSnapshots = 0;
    let cleanupAllowed = false;

    const formatDbError = (err: unknown): string => {
      const e = err as {
        message?: unknown;
        code?: unknown;
        detail?: unknown;
        hint?: unknown;
        cause?: {
          message?: unknown;
          code?: unknown;
          detail?: unknown;
          hint?: unknown;
        };
      };

      const cause = e?.cause;
      const message =
        typeof cause?.message === "string"
          ? cause.message
          : typeof e?.message === "string"
            ? e.message
            : String(err);
      const code = cause?.code ?? e?.code;
      const detail = cause?.detail ?? e?.detail;
      const hint = cause?.hint ?? e?.hint;

      return [
        code ? `code=${String(code)}` : null,
        message,
        detail ? `detail=${String(detail)}` : null,
        hint ? `hint=${String(hint)}` : null,
      ]
        .filter(Boolean)
        .join(" | ");
    };

    const upsertOne = async (row: typeof snapshots.$inferInsert) => {
      await db
        .insert(snapshots)
        .values(row)
        .onConflictDoUpdate({
          target: [snapshots.scanDate, snapshots.symbol],
          set: {
            ltp: sql`excluded."ltp"`,
            changePct: sql`excluded."change_pct"`,
            dayOpen: sql`excluded."day_open"`,
            volumeMultiple: sql`excluded."volume_multiple"`,
            volumeLabel: sql`excluded."volume_label"`,
            ema20: sql`excluded."ema20"`,
            emaBias: sql`excluded."ema_bias"`,
            pdh: sql`excluded."pdh"`,
            pdl: sql`excluded."pdl"`,
            level: sql`excluded."level"`,
            distancePct: sql`excluded."distance_pct"`,
            setup: sql`excluded."setup"`,
            status: sql`excluded."status"`,
            direction: sql`excluded."direction"`,
            entry: sql`excluded."entry"`,
            stopLoss: sql`excluded."stop_loss"`,
            target: sql`excluded."target"`,
            reason: sql`excluded."reason"`,
            details: sql`excluded."details"`,
            statusRank: sql`excluded."status_rank"`,
            active: sql`excluded."active"`,
            firstConfirmedAt: sql`excluded."first_confirmed_at"`,
            updatedAt: sql`excluded."updated_at"`,
          },
        });
    };

    for (let i = 0; i < upserts.length; i += SNAPSHOT_BATCH_SIZE) {
      const batch = upserts.slice(i, i + SNAPSHOT_BATCH_SIZE);
      if (!batch.length) continue;

      try {
        await db
          .insert(snapshots)
          .values(batch)
          .onConflictDoUpdate({
            target: [snapshots.scanDate, snapshots.symbol],
            set: {
              ltp: sql`excluded."ltp"`,
              changePct: sql`excluded."change_pct"`,
              dayOpen: sql`excluded."day_open"`,
              volumeMultiple: sql`excluded."volume_multiple"`,
              volumeLabel: sql`excluded."volume_label"`,
              ema20: sql`excluded."ema20"`,
              emaBias: sql`excluded."ema_bias"`,
              pdh: sql`excluded."pdh"`,
              pdl: sql`excluded."pdl"`,
              level: sql`excluded."level"`,
              distancePct: sql`excluded."distance_pct"`,
              setup: sql`excluded."setup"`,
              status: sql`excluded."status"`,
              direction: sql`excluded."direction"`,
              entry: sql`excluded."entry"`,
              stopLoss: sql`excluded."stop_loss"`,
              target: sql`excluded."target"`,
              reason: sql`excluded."reason"`,
              details: sql`excluded."details"`,
              statusRank: sql`excluded."status_rank"`,
              active: sql`excluded."active"`,
              firstConfirmedAt: sql`excluded."first_confirmed_at"`,
              updatedAt: sql`excluded."updated_at"`,
            },
          });
        persistedSnapshots += batch.length;
        cleanupAllowed = true;
      } catch (batchError) {
        persistenceErrors.push(
          `Batch ${Math.floor(i / SNAPSHOT_BATCH_SIZE) + 1} failed: ${formatDbError(batchError)}`
        );

        /* A bad row must never block the remaining universe. */
        for (const row of batch) {
          try {
            await upsertOne(row);
            persistedSnapshots++;
            cleanupAllowed = true;
          } catch (rowError) {
            const symbol = String(row.symbol ?? "UNKNOWN");
            persistenceErrors.push(
              `${symbol}: ${formatDbError(rowError)}`
            );
          }
        }
      }
    }

    if (eventRows.length) {
      try {
        await db.insert(signalEvents).values(eventRows);
      } catch (eventError) {
        persistenceErrors.push(
          `Signal events failed: ${formatDbError(eventError)}`
        );
      }
    }

    const dbMessage = persistenceErrors.length
      ? `Database persistence: ${persistedSnapshots}/${upserts.length} snapshot rows saved. ${persistenceErrors.slice(0, 3).join(" || ")}`
      : null;

    try {
      await db.insert(scanRuns).values({
        scanDate: dateKey,
        startedAt,
        finishedAt: new Date(),
        status: persistenceErrors.length
          ? persistedSnapshots > 0
            ? "PARTIAL"
            : "ERROR"
          : errorCount > 0
            ? "PARTIAL"
            : "OK",
        source: collected.source,
        marketPhase: phase,
        universeSize: UNIVERSE.length,
        processed,
        errorCount: errorCount + persistenceErrors.length,
        confirmed,
        setups,
        watch,
        message:
          dbMessage ??
          (errorCount > 0
            ? `${errorCount} symbol(s) failed to load and were skipped.`
            : null),
      });
    } catch (runError) {
      persistenceErrors.push(
        `Scan run write failed: ${formatDbError(runError)}`
      );
    }

    /* Never delete historical data when persistence failed completely. */
    if (cleanupAllowed) {
      await db
        .delete(snapshots)
        .where(lt(snapshots.scanDate, dateKey));

      await db
        .delete(signalEvents)
        .where(lt(signalEvents.scanDate, dateKey));

      await db
        .delete(scanRuns)
        .where(lt(scanRuns.scanDate, dateKey));
    }

    return {
      persistedSnapshots,
      persistenceErrors,
      message: dbMessage,
    };
  };

  try {'''

          new_text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate dbWrites block')

          # Replace the old bare await with structured handling.
          old = '''    await dbWrites();
  } catch (err) {
    return {
      error: `Database write failed: ${
        err instanceof Error ? err.message : String(err)
      }`,
      message: null,
    };
  }
'''
          new = '''    const dbResult = await dbWrites();

    if (dbResult.persistenceErrors.length) {
      return {
        error: dbResult.message ?? dbResult.persistenceErrors[0],
        message: dbResult.message,
      };
    }
  } catch (err) {
    const e = err as {
      message?: unknown;
      code?: unknown;
      detail?: unknown;
      cause?: { message?: unknown; code?: unknown; detail?: unknown };
    };
    const c = e?.cause;
    const detail = [
      c?.code ?? e?.code,
      c?.message ?? e?.message,
      c?.detail ?? e?.detail,
    ].filter(Boolean).join(' | ');

    return {
      error: `Database write failed: ${detail || String(err)}`,
      message: null,
    };
  }
'''
          if old not in new_text:
              raise SystemExit('Could not locate dbWrites await/catch block')
          new_text = new_text.replace(old, new, 1)

          path.write_text(new_text)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-scanner-db.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/scanner.ts .github/workflows/fix-scanner-db.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix scanner database persistence - apply"
          git push
