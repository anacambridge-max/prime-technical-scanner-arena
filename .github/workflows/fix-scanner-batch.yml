name: Fix scanner DB batch size

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch scanner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/scanner.ts')
          s = p.read_text()
          old = 'const SNAPSHOT_BATCH_SIZE = 150;'
          new = 'const SNAPSHOT_BATCH_SIZE = 25;'
          if old not in s:
              raise SystemExit('Expected batch-size line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit scanner fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/scanner.ts
          git rm .github/workflows/fix-scanner-batch.yml
          git commit -m 'Fix scanner database batch sizing'
          git push